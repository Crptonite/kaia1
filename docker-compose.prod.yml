# Kaia — Docker Compose (Production)
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Make sure .env is filled with production values before running.

services:
  db:
    image: postgres:16-alpine
    container_name: kaia_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-kaia}
    volumes:
      - kaia_pgdata_prod:/var/lib/postgresql/data
    # Do NOT expose port 5432 to the host in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runner
    container_name: kaia_app_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kaia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kaia}"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  kaia_pgdata_prod:
    driver: local
